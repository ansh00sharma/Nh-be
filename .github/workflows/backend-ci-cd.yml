name: Backend CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # CI
  # Runs on:
  #   - Pull requests to main
  #   - Pushes to main
  # ============================================================

  backend-ci:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Verify dependencies
        run: |
          pip check

      - name: Python syntax check
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          pytest -q

  # ============================================================
  # BUILD + PUSH DOCKER IMAGE
  #
  # Runs only:
  #   CI passed
  #   AND
  #   push/merge happened on main
  #
  # Does NOT run for PRs.
  # ============================================================

  docker-build:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    needs:
      - backend-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # CD
  # Deploy to EC2 after Docker image has been pushed.
  # ============================================================

  deploy:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      # --------------------------------------------------------
      # Checkout because docker-compose.yml needs to be copied
      # to EC2.
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # --------------------------------------------------------
      # Verify connection and Docker installation
      # --------------------------------------------------------

      - name: Verify EC2 and Docker
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            '
              set -e

              echo "Connected to EC2 successfully."

              echo "Docker:"
              docker --version

              echo "Docker Compose:"
              docker compose version
            '

      # --------------------------------------------------------
      # Create deployment directory
      # --------------------------------------------------------

      - name: Create deployment directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p /home/$EC2_USER/taskflow"

      # --------------------------------------------------------
      # Copy latest docker-compose.yml to server
      # --------------------------------------------------------

      - name: Copy Docker Compose file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |
          scp \
            -i ~/.ssh/ec2_key \
            docker-compose.yml \
            "$EC2_USER@$EC2_HOST:/home/$EC2_USER/taskflow/docker-compose.yml"

      # --------------------------------------------------------
      # Deployment
      #
      # No .env file is created.
      #
      # GitHub Secrets / Variables are exported temporarily
      # inside the SSH shell and Docker Compose receives them.
      # --------------------------------------------------------

      - name: Deploy application
        env:
          # ========================
          # EC2
          # ========================

          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

          # ========================
          # Docker Hub
          # ========================

          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}

          # ========================
          # Django
          # ========================

          SECRET_KEY: ${{ secrets.SECRET_KEY }}

          # ========================
          # Supabase PostgreSQL
          # ========================

          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}

          # ========================
          # Redis
          # ========================

          REDIS_URL: ${{ secrets.REDIS_URL }}

          # ========================
          # Email
          # ========================

          EMAIL_BACKEND: ${{ vars.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ vars.EMAIL_HOST }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ vars.EMAIL_USE_TLS }}

          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}

          # ========================
          # Docker image version
          # ========================

          IMAGE_TAG: ${{ github.sha }}

        run: |
          {
            # Django
            printf 'export SECRET_KEY=%q\n' "$SECRET_KEY"

            # PostgreSQL / Supabase
            printf 'export POSTGRES_DB=%q\n' "$POSTGRES_DB"
            printf 'export POSTGRES_USER=%q\n' "$POSTGRES_USER"
            printf 'export POSTGRES_PASSWORD=%q\n' "$POSTGRES_PASSWORD"
            printf 'export POSTGRES_HOST=%q\n' "$POSTGRES_HOST"
            printf 'export POSTGRES_PORT=%q\n' "$POSTGRES_PORT"

            # Redis
            printf 'export REDIS_URL=%q\n' "$REDIS_URL"

            # Email
            printf 'export EMAIL_BACKEND=%q\n' "$EMAIL_BACKEND"
            printf 'export EMAIL_HOST=%q\n' "$EMAIL_HOST"
            printf 'export EMAIL_PORT=%q\n' "$EMAIL_PORT"
            printf 'export EMAIL_USE_TLS=%q\n' "$EMAIL_USE_TLS"
            printf 'export EMAIL_HOST_USER=%q\n' "$EMAIL_HOST_USER"
            printf 'export EMAIL_HOST_PASSWORD=%q\n' "$EMAIL_HOST_PASSWORD"

            # Docker
            printf 'export DOCKERHUB_USERNAME=%q\n' "$DOCKERHUB_USERNAME"
            printf 'export DOCKERHUB_TOKEN=%q\n' "$DOCKERHUB_TOKEN"
            printf 'export DOCKERHUB_REPOSITORY=%q\n' "$DOCKERHUB_REPOSITORY"
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"


            cat <<'REMOTE_SCRIPT'

          set -euo pipefail

          echo "========================================="
          echo "Starting TaskFlow backend deployment"
          echo "========================================="


          cd "$HOME/taskflow"


          # ====================================================
          # Docker image
          # ====================================================

          export DOCKER_IMAGE="${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}:${IMAGE_TAG}"


          echo "Deploying image:"
          echo "$DOCKER_IMAGE"


          # ====================================================
          # Docker Hub login
          # ====================================================

          echo "Logging in to Docker Hub..."

          printf '%s' "$DOCKERHUB_TOKEN" | \
            docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin


          # ====================================================
          # Pull exact backend image created from this commit
          # ====================================================

          echo "Pulling backend image..."

          docker compose pull backend


          # ====================================================
          # Start Redis
          #
          # Container:
          # taskflow-redis
          # ====================================================

          echo "Starting Redis..."

          docker compose up -d redis


          # ====================================================
          # Wait until Redis is healthy
          # ====================================================

          echo "Waiting for Redis to become healthy..."

          REDIS_ATTEMPTS=0

          until [ \
            "$(docker inspect \
              --format='{{.State.Health.Status}}' \
              taskflow-redis 2>/dev/null || echo starting)" \
            = "healthy" \
          ]; do

            REDIS_ATTEMPTS=$((REDIS_ATTEMPTS + 1))

            if [ "$REDIS_ATTEMPTS" -ge 30 ]; then

              echo "Redis failed to become healthy."

              docker logs --tail 100 taskflow-redis || true

              exit 1
            fi

            echo "Redis is still starting..."

            sleep 2

          done


          echo "Redis is healthy."


          # ====================================================
          # Run Django migrations
          #
          # Database is Supabase, not local Docker PostgreSQL.
          # ====================================================

          echo "Running Django migrations..."

          docker compose run --rm backend \
            python manage.py migrate --noinput


          # ====================================================
          # Start / recreate backend
          #
          # Container:
          # taskflow-backend
          # ====================================================

          echo "Starting TaskFlow backend..."

          docker compose up \
            -d \
            --remove-orphans \
            backend


          # ====================================================
          # Wait for Gunicorn / Django to start
          # ====================================================

          echo "Waiting for backend container..."

          sleep 5


          # ====================================================
          # Verify backend container
          # ====================================================

          if ! docker ps \
            --format '{{.Names}}' \
            | grep -qx 'taskflow-backend'; then

            echo "Backend container failed to start."

            echo "Backend logs:"
            docker logs --tail 100 taskflow-backend || true

            exit 1

          fi


          echo "Backend container is running."


          # ====================================================
          # Show containers
          # ====================================================

          echo ""
          echo "========================================="
          echo "Container status"
          echo "========================================="

          docker compose ps


          # ====================================================
          # Show backend logs
          # ====================================================

          echo ""
          echo "========================================="
          echo "Latest backend logs"
          echo "========================================="

          docker logs \
            --tail 30 \
            taskflow-backend || true


          # ====================================================
          # Cleanup old dangling images
          # ====================================================

          echo "Cleaning unused images..."

          docker image prune -f


          # ====================================================
          # Logout from Docker Hub
          # ====================================================

          docker logout || true


          echo ""
          echo "========================================="
          echo "TaskFlow backend deployed successfully"
          echo "========================================="

          REMOTE_SCRIPT

          } | ssh \
              -i ~/.ssh/ec2_key \
              "$EC2_USER@$EC2_HOST" \
              'bash -s'

      # --------------------------------------------------------
      # Remove local SSH key from GitHub runner
      # --------------------------------------------------------

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key
